name: Build and Deploy with Helm

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
      # 1. Checkout code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Build Docker image
      - name: Build Docker Image
        run: |
          docker build -t myapp:${{ github.sha }} .

      # 3. Tag image
      - name: Tag Docker Image
        run: |
          docker tag myapp:${{ github.sha }} myapp:latest

      # 4. Deploy using Helm
      - name: Deploy with Helm
        run: |
          helm upgrade --install update ./mychart \
            --namespace default

      # 5. Check Helm deployment
      - name: Check Helm Release
        run: |
          helm status update

      # 6. Check Kubernetes resources
      - name: Check Kubernetes Pods
        run: |
          kubectl get pods

      - name: Check Kubernetes Service
        run: |
          kubectl get svc

name: Build and Deploy with Helm

on:
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
      - name: Clone Application Repository
        run: |
          rm -rf demo-app
          git clone https://github.com/USERNAME/REPOSITORY.git demo-app

      - name: Build Docker Image
        run: |
          cd demo-app
          docker build -t demo-app:latest .

      - name: Import Image into K3s
        run: |
          docker save demo-app:latest | sudo k3s ctr images import -

      - name: Deploy with Helm
        run: |
          helm upgrade --install demo-app ./mychart

      - name: Verify Deployment
        run: |
          helm status demo-app
          kubectl get pods
          kubectl get svc
